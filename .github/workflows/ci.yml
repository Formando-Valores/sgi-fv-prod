name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  build:
    name: Typecheck e build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Instalar dependências
        run: npm ci

      # Bloqueante: o repositório está a zero erros de tipos desde o PR que
      # introduziu este workflow. Qualquer regressão falha o PR.
      - name: Typecheck
        run: npm run typecheck

      - name: Testes unitários
        run: npm test

      - name: Build
        run: npm run build

  edge-functions:
    name: Verificação das Edge Functions (Deno)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - name: Verificar funções críticas
        run: |
          deno check \
            supabase/functions/send-access-credentials/index.ts \
            supabase/functions/create-user/index.ts \
            supabase/functions/stripe-create-checkout-session/index.ts \
            supabase/functions/weekly-org-report/index.ts \
            supabase/functions/create-process-client-user/index.ts \
            supabase/functions/wix-client-intake/index.ts \
            supabase/functions/forgot-password/index.ts \
            supabase/functions/stripe-webhook/index.ts
